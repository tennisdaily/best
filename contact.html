<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div id="site-header-root"></div>

    <main class="flex-grow w-full">
        <section class="hero-band court-pattern py-10 md:py-14 px-4 text-center">
            <span class="hero-eyebrow"><span class="icon-svg" data-icon="envelope"></span>Une question ?</span>
            <h1 class="font-display text-3xl md:text-4xl font-bold mt-3">Nous contacter</h1>
        </section>

        <div class="max-w-xl mx-auto px-4 py-10 md:py-14">
            <form id="contact-form" onsubmit="submitContactForm(event)" class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 md:p-8 space-y-4">
                <div>
                    <label class="field-label">Nom</label>
                    <input type="text" id="contact-name" class="field-input" required>
                </div>
                <div>
                    <label class="field-label">Email</label>
                    <input type="email" id="contact-email" class="field-input" required>
                </div>
                <div>
                    <label class="field-label">Message</label>
                    <textarea id="contact-message" rows="5" class="field-input" required></textarea>
                </div>
                <button type="submit" id="contact-submit-btn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-md flex items-center justify-center gap-2">
                    <span class="icon-svg" data-icon="envelope"></span> Envoyer le message
                </button>
                <p id="contact-success" class="hidden text-emerald-700 text-sm font-semibold text-center">Message envoyé, merci ! Nous vous répondrons rapidement.</p>
                <p id="contact-error" class="hidden text-red-500 text-sm font-semibold text-center">Une erreur est survenue, merci de réessayer.</p>
            </form>
        </div>
    </main>

    <div id="site-footer-root"></div>

    <script src="site.js"></script>
    <script src="contact.js"></script>
</body>
</html>
