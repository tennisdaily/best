<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <script>
    // Redirige les anciens liens de l'ex-version mono-page (?page=..., ?article=...)
    // vers les nouvelles pages dédiées, pour ne perdre ni visiteurs ni référencement.
    (function () {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page');
        const article = params.get('article');
        const map = { atp: 'atp.html', wta: 'wta.html', itf: 'itf.html', about: 'a-propos.html', privacy: 'confidentialite.html', legal: 'mentions-legales.html' };
        if (article) window.location.replace('article.html?a=' + encodeURIComponent(article));
        else if (page && map[page]) window.location.replace(map[page]);
    })();
    </script>
